services:
  wsl-intel-irisxe-framework-dev:
    container_name: ${CONTAINER_NAME:-deep-learning-dev}
    build:
      context: .
      dockerfile: Dockerfile.intel-irisxe-framework
      args:
        FRAMEWORK: ${FRAMEWORK:-pytorch}
    image: deep-learning-dev-env:intel-irisxe-${FRAMEWORK:-pytorch}
    user: root
    ports:
      - "${JUPYTER_HOST_PORT:-8888}:8888"
    volumes:
      - type: bind
        source: ${SOURCE_PATH}
        target: /home/workspace/${PROJECT_NAME}
      - type: bind
        source: ${DRIVE_PATH}
        target: /home/drive
        read_only: true
      - type: bind
        source: /usr/lib/wsl
        target: /usr/lib/wsl
        read_only: true
      - type: bind
        source: ${AI_COMPUTE_BENCHMARK_PATH}
        target: /home/workspace/ai-compute-benchmark
    environment:
      DEEP_LEARNING_FRAMEWORK: ${FRAMEWORK:-pytorch}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
      TF_ENABLE_ONEDNN_OPTS: "1"
      UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
    working_dir: /home/workspace
    devices:
      - /dev/dxg:/dev/dxg
    restart: unless-stopped
    command: sleep infinity
