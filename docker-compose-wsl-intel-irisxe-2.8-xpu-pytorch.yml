version: "3.9"

services:
  wsl-intel-irisxe-2.8-xpu-pytorch-dev:
    profiles: ["wsl-intel-irisxe-2.8-xpu-pytorch"]
    image: intel--irisxe-2.8-levelzero-xpu-pytorch:latest
    build:
        context: .
        dockerfile: Dockerfile.intel-irisxe-2.8-levelzero-xpu-pytorch
    user: root
    volumes:
      - type: bind
        source: ${SOURCE_PATH}
        target: /home/workspace/${PROJECT_NAME}
      - type: bind
        source: ${DRIVE_PATH}
        target: /home/drive
        read_only: true
      - type : bind
        source: /usr/lib/wsl
        target: /usr/lib/wsl
        read_only: true
      - type : bind
        source : ${AI_COMPUTE_BENCHMARK_PATH}
        target : /home/workspace/ai-compute-benchmark
    environment:
      PYTHONUNBUFFERED: "1"
      LD_LIBRARY_PATH: "/usr/lib/wsl/lib"
    working_dir: /home/workspace
    devices:
      - /dev/dxg:/dev/dxg
    restart: unless-stopped
