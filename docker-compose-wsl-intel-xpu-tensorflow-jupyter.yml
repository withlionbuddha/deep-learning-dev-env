version: "3.9"

services:
  wsl-intel-xpu-tensorflow-jupyter-dev:
    profiles: ["wsl-intel-xpu-tensorflow-jupyter"]
    image: intel-opencl-levelzero-xpu-tensorflow-jupyter:latest
    build:
      context: .
      dockerfile: Dockerfile.intel-opencl-levelzero-xpu-tensorflow-jupyter
    ports:
      - "${TENSORFLOW_XPU_HOST_PORT}:8888"
    volumes:
      - type: bind
        source: ${SOURCE_PATH}
        target: /home/workspace/${PROJECT_NAME}
      - type: bind
        source: ${DRIVE_PATH}
        target: /home/drive
        read_only: true
      - type: bind
        source: /usr/lib/wsl
        target: /usr/lib/wsl
        read_only: true
      - type: bind
        source: ${AI_COMPUTE_BENCHMARK_PATH}
        target: /home/workspace/ai-compute-benchmark
    environment:
      PYTHONUNBUFFERED: "1"
      TF_ENABLE_ONEDNN_OPTS: "1"
      UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
    working_dir: /home/workspace
    devices:
      - /dev/dxg:/dev/dxg
    restart: unless-stopped
